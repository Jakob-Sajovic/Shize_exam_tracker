<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0078d4" />
  <meta name="description" content="Vnos zobnega statusa — UKC Shize 2025" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Zobni status" />
  <title>Zobni status — UKC Shize 2025</title>
</head>
<body>
  <div id="app">
    <div id="update-banner" class="update-banner" hidden>
      <span>Na voljo je nova različica aplikacije.</span>
      <button type="button" id="update-reload-btn" class="update-banner-btn">Osveži</button>
    </div>

    <div class="status-bar">
      <span id="build-id" class="build-id"></span>
      <span id="autosave-indicator" class="autosave-indicator"></span>
    </div>

    <nav id="tab-bar" class="tab-bar"></nav>

    <div id="panel-container" class="panel-container">
      <div class="tab-panel" data-tab="landing"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="subject"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="teeth"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="plaque"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="bleeding"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="caries"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="fillings"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="diagnosis"><div class="panel-scroll"></div></div>
      <div class="tab-panel" data-tab="export"><div class="panel-scroll"></div></div>
    </div>
  </div>
</body>
</html>
